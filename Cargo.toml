[package]
name = "ilt-native"
version = "0.1.8"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rust acceleration for ilt-inversion"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
astro-float = "0.9.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
